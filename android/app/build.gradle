plugins { id 'com.android.application' }

android {
    namespace 'com.contactflow.pro'
    compileSdk 36

    defaultConfig {
        applicationId 'com.contactflow.pro'
        minSdk 21
        targetSdk 36
        versionCode 30101
        versionName '3.1.0-alpha.1'
    }
}

dependencies {
    // 1.14.0 keeps minSdk 21 compatibility and provides WebViewAssetLoader.
    implementation "androidx.webkit:webkit:1.14.0"
}
