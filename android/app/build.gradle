plugins { id 'com.android.application' }

android {
    namespace 'com.contactflow.pro'
    compileSdk 36

    defaultConfig {
        applicationId 'com.contactflow.pro'
        minSdk 23
        targetSdk 36
        versionCode 30600
        versionName '3.6.0'
    }
}

dependencies {
    // WebViewAssetLoader plus bundled on-device ML Kit OCR (ML Kit requires API 23+).
    implementation "androidx.webkit:webkit:1.14.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
}
