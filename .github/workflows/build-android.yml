name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'pro.js'
      - 'config.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Sync PWA assets into Android
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/icons
          cp index.html app.js pro.js config.js styles.css manifest.webmanifest sw.js android/app/src/main/assets/
          cp -r icons/* android/app/src/main/assets/icons/
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify bundled app
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/app.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/pro.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/config.js'
      - uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Professional-Android-1.2
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
