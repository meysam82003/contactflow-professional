name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0'
          sdkmanager --list_installed

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Verify bundled PWA
        shell: bash
        run: |
          test -s android/pwa_assets.zip
          unzip -t android/pwa_assets.zip

      - name: Prepare bundled PWA assets
        shell: bash
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          unzip -q android/pwa_assets.zip -d android/app/src/main/assets
          test -s android/app/src/main/assets/index.html

      - name: Build debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon -p android :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee android-build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Professional-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Android-Build-Diagnostics
          path: |
            android-build.log
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Report successful build
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "✅ Android APK build succeeded. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} — commit ${GITHUB_SHA}" || true

      - name: Report failed build
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '❌ Android APK build failed.'
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo '### Gradle log tail'
            echo '```text'
            if [ -f android-build.log ]; then tail -n 160 android-build.log; else echo 'android-build.log was not created; failure happened before the Gradle build step.'; fi
            echo '```'
          } > /tmp/contactflow-build-status.md
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body-file /tmp/contactflow-build-status.md || true
