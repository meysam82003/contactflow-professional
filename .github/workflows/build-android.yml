name: Build ContactFlow Personal Ultimate 3.1 Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'enhancements/**'
      - 'scripts/apply-v31.mjs'
      - '.source-bundles/v3/**'
      - '.source-bundles/v31/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0' }
      - name: Build augmented web core
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MINIAPP_URL: ${{ secrets.MINIAPP_URL }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cf31 && mkdir -p /tmp/cf31
          cat .source-bundles/v3/web3.part* | base64 -d > /tmp/cf3.tgz
          tar -xzf /tmp/cf3.tgz -C /tmp/cf31
          rm -rf /tmp/cf31aug && mkdir -p /tmp/cf31aug
          cat .source-bundles/v31/augment.part* | base64 -d > /tmp/cf31aug.tgz
          tar -xzf /tmp/cf31aug.tgz -C /tmp/cf31aug
          cd /tmp/cf31aug/enhancements
          npm install --no-audit --no-fund
          npm run build
          cd $GITHUB_WORKSPACE
          cp /tmp/cf31aug/enhancements/dist/telegram-web.bundle.js /tmp/cf31aug/enhancements/runtime-patch.js /tmp/cf31aug/enhancements/drive-sync.js /tmp/cf31aug/enhancements/enhancements.css /tmp/cf31/
          node /tmp/cf31aug/scripts/apply-v31.mjs /tmp/cf31
          cp /tmp/cf31aug/MainActivity.java android/app/src/main/java/com/contactflow/pro/MainActivity.java
          cp /tmp/cf31aug/android-build.gradle android/app/build.gradle
          rm -rf android/app/src/main/assets && mkdir -p android/app/src/main/assets
          cp -R /tmp/cf31/. android/app/src/main/assets/
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/index.html | grep -q 'Personal Ultimate 3.1'
          unzip -p "$APK" assets/index.html | grep -q 'telegram-web.bundle.js'
          mkdir -p dist && cp "$APK" dist/ContactFlow_Personal_Ultimate_3.1.0-alpha.1_Android_Alpha.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Personal-Ultimate-3.1-Android
          path: dist/*
          retention-days: 30
