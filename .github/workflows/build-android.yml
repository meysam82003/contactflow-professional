name: Build Android — Personal Ultimate 3.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.source-bundles/v3/**'
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - 'android-trigger.txt'

permissions:
  contents: read
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize and verify Personal Ultimate web core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cf3 && mkdir -p /tmp/cf3
          cat .source-bundles/v3/web3.part* | base64 -d > /tmp/cf3.tgz
          tar -xzf /tmp/cf3.tgz -C /tmp/cf3
          node --check /tmp/cf3/app.js
          node --check /tmp/cf3/ultimate.js
          grep -q 'ContactFlow' /tmp/cf3/index.html
          grep -q 'Personal Ultimate 3.0' /tmp/cf3/index.html
          ! grep -ERn 'auth-gate|auth-login|auth-register|Forgot Password|Server URL|127\.0\.0\.1:17654|pseudoQR' /tmp/cf3/index.html /tmp/cf3/app.js /tmp/cf3/ultimate.js /tmp/cf3/config.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Sync local assets
        shell: bash
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp /tmp/cf3/index.html /tmp/cf3/app.js /tmp/cf3/ultimate.js /tmp/cf3/config.js /tmp/cf3/styles.css /tmp/cf3/manifest.webmanifest /tmp/cf3/sw.js android/app/src/main/assets/
          cp -R /tmp/cf3/icons android/app/src/main/assets/icons

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify Android 5+ APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "sdkVersion:'21'" apk-badging.txt
          grep "targetSdkVersion:'36'" apk-badging.txt
          unzip -p "$APK" assets/index.html > /tmp/index.html
          grep -q 'ContactFlow' /tmp/index.html
          grep -q 'Personal Ultimate 3.0' /tmp/index.html
          grep -q 'data-page="generator"' /tmp/index.html
          grep -q 'data-page="telegram"' /tmp/index.html
          grep -q 'data-page="backup"' /tmp/index.html
          ! grep -E 'auth-gate|auth-login|auth-register|Server URL|127\.0\.0\.1:17654' /tmp/index.html
          cp "$APK" ContactFlow_Personal_Ultimate_3.0_Android_Alpha.apk
          sha256sum ContactFlow_Personal_Ultimate_3.0_Android_Alpha.apk > apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Personal-Ultimate-3.0-Android-Alpha
          path: |
            ContactFlow_Personal_Ultimate_3.0_Android_Alpha.apk
            apk-sha256.txt
            apk-badging.txt
          retention-days: 30

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "✅ ContactFlow Personal Ultimate 3.0 Android build succeeded — Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} — commit ${GITHUB_SHA}"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "❌ ContactFlow Personal Ultimate 3.0 Android build failed — Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} — commit ${GITHUB_SHA}"
