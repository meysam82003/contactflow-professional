name: Build ContactFlow Personal Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'personal2-trigger.txt'
permissions:
  contents: read
  issues: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Sync Personal 2.0 PWA assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/icons
          cp index.html app.js pro.js config.js styles.css manifest.webmanifest sw.js android/app/src/main/assets/
          cp -r icons/* android/app/src/main/assets/icons/
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "sdkVersion:'21'" apk-badging.txt
          grep "targetSdkVersion:'36'" apk-badging.txt
          unzip -p "$APK" assets/index.html | grep 'ContactFlow Personal 2.0'
          unzip -p "$APK" assets/index.html | grep 'data-page="backup"'
          ! unzip -p "$APK" assets/index.html | grep -q 'auth-gate'
          sha256sum "$APK" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Personal-2.0-Android-Alpha1
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            apk-badging.txt
          retention-days: 30
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "✅ ContactFlow Personal 2.0 Android Alpha 1 succeeded — Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} — commit ${GITHUB_SHA}"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "❌ ContactFlow Personal 2.0 Android Alpha 1 failed — Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} — commit ${GITHUB_SHA}"
