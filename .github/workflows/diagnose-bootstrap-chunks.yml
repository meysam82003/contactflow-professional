name: Diagnose ContactFlow Bootstrap Chunks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-bootstrap-chunks.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify each source chunk
        id: verify
        shell: bash
        run: |
          set -u
          failed=0
          check_file() {
            file="$1"; expected="$2"; label="$3"
            actual=$(tr -d '\r\n\t ' < "$file" | sha256sum | awk '{print $1}')
            if [ "$actual" = "$expected" ]; then
              echo "OK $label $actual"
            else
              echo "BAD $label expected=$expected actual=$actual"
              failed=1
            fi
          }
          check_file bootstrap/source.part00.b64 f996bb717a808e35852ba8ab1c8194656a7d8acbdc5786cbe534f85f2c06530e part00
          check_file bootstrap/source.part01.b64 fcd61513af8223d95c87c7c34d86cb6f19c095c2bcd5427f0ac838a6fc37c998 part01
          check_file bootstrap/source.part02.b64 4aaaedfe791b53d6659d00da5c9711b30f1a55f34058da96dbff84e7ffd125b2 part02
          check_file bootstrap/source.part03.b64 f4100f880bcdc6bab310fd6a15203d64ce3a5b9b50bd49ef6677a9511af43a16 part03
          check_file bootstrap/source.part04.b64 633afd95932f0b7eb2d3698e6bb8690dc966b6c9d758233af517dd95546b4682 part04
          cat bootstrap/source.part05.b64 bootstrap/source.part05.tail.b64 | tr -d '\r\n\t ' > /tmp/p05
          check_file /tmp/p05 5e0edd425bd0d99e5db9aa6734c9322e3282adb22004561cf4e746c43285e5ac part05-combined
          check_file bootstrap/source.part06.b64 6dbf31dc4ac80d31deeb4842850bb2bbda3077c24c8fe55cd19fb3a5a302a31a part06
          check_file bootstrap/source.part07.b64 c8c269dd56d7e32564a6200c91b3042237b61b124e6bbbb75e6978df6b8101ed part07
          check_file bootstrap/source.part08.b64 210ee435a09a3cc3e644ae8a71f8fe52d4f6a78d9226a9621c45c4a813f24826 part08
          check_file bootstrap/source.part09.b64 b6a57916d2739c50fedcab51e67688cefa394798eb4a1bbde2e4a07c42559cdf part09
          cat bootstrap/source.part10a.clean.b64 bootstrap/source.part10b.clean.b64 | tr -d '\r\n\t ' > /tmp/p10
          check_file /tmp/p10 b78b95eec7364c8ea78a9913011c9e9f5ffbbe720f47b2a03985d4ee6fc37ab2 part10-combined
          check_file bootstrap/source.part11.b64 16bfc2ac5d8d45810818b0d522f4232b691a2b3f0367511a01027853eff07a03 part11
          check_file bootstrap/source.part12.b64 fab2eed9670255d08448bc7dc44dfdcbfee04194daa85fffe418413a26c9ba1c part12
          exit $failed
      - name: Report result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status='✅ all bootstrap chunks match local source'
          if [ '${{ job.status }}' != 'success' ]; then status='❌ one or more bootstrap chunks differ; inspect job log'; fi
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "$status — run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
