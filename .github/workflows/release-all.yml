name: Release All Devices — ContactFlow 3.6

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'enhancements/**'
      - 'telegram-miniapp/**'
      - 'desktop/**'
      - 'extensions/**'
      - 'android/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'VERSION'
      - 'package.json'
      - 'README.md'
      - 'README_FA.md'
      - 'CHANGELOG.md'
      - '.github/workflows/release-all.yml'

permissions:
  contents: write

concurrency:
  group: contactflow-release-3.6
  cancel-in-progress: false

env:
  VERSION: 3.6.0
  PREFIX: ContactFlow_Personal_Ultimate_3.6.0

jobs:
  webcore:
    runs-on: ubuntu-latest
    outputs:
      telegram_configured: ${{ steps.configure.outputs.telegram_configured }}
      google_configured: ${{ steps.configure.outputs.google_configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source and unit tests
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "$VERSION"
          npm test
          npm run verify
          node --check web/app.js
          node --check web/ultimate.js
          node --check web/contact-export.js
          node --check web/import-merge.js
          node --check web/runtime-patch.js
          node --check web/v33.js
          node --check web/v34.js
          node --check web/location-operator.js
          node --check web/channel-handoff.js
          node --check web/v35.js
          node --check web/name-engine.js
          node --check web/telegram-export.js
          node --check web/legacy-tools.js
          node --check web/file-save.js
          node --check web/v36.js

      - name: Build Telegram User API connector
        run: |
          set -euo pipefail
          npm --prefix enhancements install --no-audit --no-fund
          npm --prefix enhancements run build
          test -s enhancements/dist/telegram-web.bundle.js

      - name: Assemble shared web core
        id: configure
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MINIAPP_URL: ${{ secrets.MINIAPP_URL }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
        run: |
          set -euo pipefail
          mkdir -p build/webcore build/pwa
          cp -R web/. build/webcore/
          cp enhancements/dist/telegram-web.bundle.js build/webcore/
          node scripts/configure-build.mjs build/webcore > build/config-summary.json
          cp -R build/webcore/. build/pwa/
          cp README.md README_FA.md CHANGELOG.md SECURITY.md build/pwa/
          mkdir -p build/pwa/docs
          cp docs/ARCHITECTURE_FA.md docs/FEATURES_3_3_FA.md docs/FEATURES_3_4_FA.md docs/FEATURES_3_5_FA.md docs/FEATURES_3_6_FA.md docs/RELEASE_CHECKLIST_FA.md docs/TELEGRAM_CONTACT_EXPORT_3_3_FA.md build/pwa/docs/
          (cd build/pwa && zip -qr "../${PREFIX}_PWA.zip" .)
          grep -q 'telegram-web.bundle.js' build/webcore/index.html
          grep -q 'data-page="telegram-contacts"' build/webcore/v33.js
          grep -q 'data-page="smart-import"' build/webcore/v34.js
          grep -q 'data-page="channels"' build/webcore/v35.js
          grep -q 'data-page="insights"' build/webcore/v36.js
          grep -q 'data-page="telegram-offline"' build/webcore/v36.js
          grep -q 'data-page="legacy-tools"' build/webcore/v36.js
          grep -q 'planMerge' build/webcore/import-merge.js
          grep -q 'Api.contacts.GetContacts' enhancements/telegram-web-entry.js
          grep -q 'ContactFlowSpreadsheet' enhancements/telegram-web-entry.js
          node --check build/webcore/telegram-web.bundle.js
          test -s "build/${PREFIX}_PWA.zip"
          node - <<'NODE'
          const fs=require('fs');const data=JSON.parse(fs.readFileSync('build/config-summary.json','utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`telegram_configured=${data.telegramConfigured}\ngoogle_configured=${data.googleConfigured}\n`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: cf36-webcore
          path: build/webcore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: cf36-release-pwa
          path: build/${{ env.PREFIX }}_PWA.zip
          retention-days: 30

  desktop:
    needs: webcore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/download-artifact@v4
        with:
          name: cf36-webcore
          path: desktop/webapp
      - name: Build Windows, Linux and macOS shells
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "$VERSION"
          grep -q 'const appVersion = "3.6.0"' desktop/main.go
          mkdir -p dist
          (cd desktop && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "../dist/${PREFIX}_Windows_Portable.exe" .)
          (cd desktop && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "../dist/${PREFIX}_Linux_x64" .)
          (cd desktop && CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "../dist/${PREFIX}_macOS_Intel" .)
          (cd desktop && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o "../dist/${PREFIX}_macOS_AppleSilicon" .)
          mkdir -p desktop/installer/payload
          cp "dist/${PREFIX}_Windows_Portable.exe" desktop/installer/payload/ContactFlow.exe
          (cd desktop/installer && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "../../dist/${PREFIX}_Windows_Setup.exe" .)
          for file in Windows_Portable.exe Windows_Setup.exe Linux_x64 macOS_Intel macOS_AppleSilicon; do test -s "dist/${PREFIX}_${file}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: cf36-release-desktop
          path: dist/*
          retention-days: 30

  desktop_extensions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native sequential file renamer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'extensions/sequential-file-renamer/SequentialFileRenamer.csproj'
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o build/file-renamer
          $source = 'build/file-renamer/ContactFlow.SequentialFileRenamer.exe'
          if (!(Test-Path $source)) { throw 'Sequential File Renamer executable was not produced.' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $target = 'dist/ContactFlow_3.6_Sequential_File_Renamer_Windows_x64.exe'
          Copy-Item $source $target
          $hash = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          "$hash  ContactFlow_3.6_Sequential_File_Renamer_Windows_x64.exe" | Set-Content -Encoding ascii dist/ContactFlow_3.6_Sequential_File_Renamer_SHA256.txt
          if ((Get-Item $target).Length -lt 1000000) { throw 'Sequential File Renamer executable is unexpectedly small.' }
      - uses: actions/upload-artifact@v4
        with:
          name: cf36-release-desktop-extensions
          path: dist/*
          retention-days: 30

  android:
    needs: webcore
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: actions/download-artifact@v4
        with:
          name: cf36-webcore
          path: android/app/src/main/assets
      - name: Build and verify APKs
        run: |
          set -euo pipefail
          (cd android && gradle --no-daemon :app:assembleDebug :messengercontacts:assembleDebug --stacktrace)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          MESSENGER_APK=android/messengercontacts/build/outputs/apk/debug/messengercontacts-debug.apk
          test -s "$APK"
          test -s "$MESSENGER_APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "sdkVersion:'23'" apk-badging.txt
          grep "targetSdkVersion:'36'" apk-badging.txt
          unzip -p "$APK" assets/v33.js | grep -q 'telegram-contacts'
          unzip -p "$APK" assets/v34.js | grep -q 'smart-import'
          unzip -p "$APK" assets/v35.js | grep -q 'data-page="channels"'
          unzip -p "$APK" assets/v36.js | grep -q 'telegram-offline'
          unzip -p "$APK" assets/v36.js | grep -q 'legacy-tools'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.READ_CONTACTS'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$MESSENGER_APK" | tee messenger-apk-badging.txt
          grep "package: name='com.contactflow.messengercontacts'" messenger-apk-badging.txt
          grep "sdkVersion:'23'" messenger-apk-badging.txt
          grep "targetSdkVersion:'36'" messenger-apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$MESSENGER_APK" | grep -q 'android.permission.READ_CONTACTS'
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$MESSENGER_APK" | grep -q 'android.permission.INTERNET'; then echo 'Messenger Contacts APK must stay offline' >&2; exit 1; fi
          unzip -p "$MESSENGER_APK" classes.dex > messenger-classes.dex
          grep -aq 'ContactsContract' messenger-classes.dex
          grep -aq 'android.intent.action.CREATE_DOCUMENT' messenger-classes.dex
          mkdir -p dist
          cp "$APK" "dist/${PREFIX}_Android.apk"
          cp "$MESSENGER_APK" "dist/ContactFlow_3.6_Messenger_Contacts_Android.apk"
          sha256sum "dist/${PREFIX}_Android.apk" "dist/ContactFlow_3.6_Messenger_Contacts_Android.apk" > dist/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cf36-release-android
          path: dist/*
          retention-days: 30

  miniapp:
    needs: webcore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: cf36-webcore
          path: build/webcore
      - name: Build full shared-core Mini App package
        run: |
          set -euo pipefail
          mkdir -p build/miniapp
          node scripts/build-miniapp.mjs build/webcore build/miniapp
          cp telegram-miniapp/.htaccess telegram-miniapp/*.php telegram-miniapp/README_FA.md build/miniapp/
          mkdir -p build/miniapp/storage
          cp telegram-miniapp/storage/.htaccess telegram-miniapp/storage/index.html build/miniapp/storage/
          for file in build/miniapp/*.php; do php -l "$file"; done
          grep -q 'telegram.org/js/telegram-web-app.js' build/miniapp/miniapp.html
          grep -q 'v33.js' build/miniapp/miniapp.html
          grep -q 'v34.js' build/miniapp/miniapp.html
          grep -q 'v35.js' build/miniapp/miniapp.html
          grep -q 'v36.js' build/miniapp/miniapp.html
          grep -q 'telegram-contacts' build/miniapp/v33.js
          grep -q 'smart-import' build/miniapp/v34.js
          grep -q 'data-page="channels"' build/miniapp/v35.js
          grep -q 'data-page="telegram-offline"' build/miniapp/v36.js
          mkdir -p dist
          (cd build/miniapp && zip -qr "../../dist/${PREFIX}_Telegram_MiniApp_cPanel.zip" .)
          test -s "dist/${PREFIX}_Telegram_MiniApp_cPanel.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cf36-release-miniapp
          path: dist/*
          retention-days: 30

  source:
    needs: webcore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package auditable source
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output="dist/${PREFIX}_Source.zip" HEAD
          test -s "dist/${PREFIX}_Source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cf36-release-source
          path: dist/*
          retention-days: 30

  release:
    if: github.event_name != 'pull_request'
    needs: [webcore, desktop, desktop_extensions, android, miniapp, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cf36-release-*
          path: release
          merge-multiple: true
      - name: Generate release metadata and checksums
        env:
          TELEGRAM_CONFIGURED: ${{ needs.webcore.outputs.telegram_configured }}
          GOOGLE_CONFIGURED: ${{ needs.webcore.outputs.google_configured }}
        run: |
          set -euo pipefail
          cd release
          cat > "${PREFIX}_RELEASE_INFO_FA.txt" <<EOF
          ContactFlow Personal Ultimate 3.6.0
          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Shared web core across PWA/Desktop/Android/Mini App: yes
          Telegram contacts primary method: official Telegram Desktop result.json/HTML export; no API ID/hash
          Telegram Mini App method: user-selected export file, local view/import/VCF/CSV
          Android device contacts: explicit READ_CONTACTS runtime permission
          Android business card OCR: on-device ML Kit
          Smart Import/Merge: atomic analyze+commit by default, optional preview, per-file undo and rollback
          Build-level Telegram credentials required: no
          City intelligence and Legacy V14 toolbox: yes
          Essential extensions: native sequential Windows file renamer + offline Android messenger-contact inspector
          Google OAuth configured: ${GOOGLE_CONFIGURED}
          Data model: Local-First; no ContactFlow account server required
          EOF
          find . -maxdepth 1 -type f ! -name "${PREFIX}_SHA256.txt" -print0 | sort -z | xargs -0 sha256sum > "${PREFIX}_SHA256.txt"
          ls -lh
      - name: Publish GitHub Release 3.6.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v3.6.0
          target_commitish: main
          name: ContactFlow Personal Ultimate 3.6.0
          prerelease: false
          make_latest: true
          overwrite_files: true
          preserve_order: true
          files: release/*
          body: |
            # ContactFlow Personal Ultimate 3.6.0

            نسخه ۳.۶ ورود اتمیک مخاطبین، تلگرام بدون API، نام‌گذاری دقیق، هوش شهری، ذخیره با نام و جعبه‌ابزار آفلاین V14 را در هسته مشترک Mini App، PWA، Android، Windows، Linux و macOS یکپارچه می‌کند.

            - Import هم‌زمان CSV/TSV/TXT/VCF/JSON/XLS/XLSX/ZIP، Drag & Drop، Progress و کنترل فایل خراب/Zip Bomb
            - تشخیص `Qom.txt → قم`، ترانویسی فارسی، تشخیص کشور/شهر تلفن ثابت، E.164، نوع و اعتبار شماره و تفکیک شرکت
            - تحلیل و ثبت اتمیک با یک دکمه، راستی‌آزمایی دیتابیس، پیش‌نمایش اختیاری، انتخاب قدیم/جدید/هوشمند و گزارش کامل
            - Undo مستقل هر فایل، Rollback آخرین Merge، شماره‌گذاری مجدد، برچسب منبع، Watch Folder هنگام اجرای برنامه و ZIP عکس
            - دفترچه Android با مجوز صریح، OCR محلی کارت ویزیت، Contact Picker انتخابی وب و Web Share موبایل
            - مشاهده، جستجو، ثبت و VCF/CSV مخاطبین فایل رسمی Telegram Desktop بدون API ID/Hash و بدون Session مخفی
            - تشخیص شهر و استان از متن فارسی/انگلیسی/فینگلیش و جستجوی استان در مخاطبین
            - تشخیص اپراتور اولیه و قانون منبع خودکار/ثابت ذخیره‌شده برای Importهای بعدی
            - صف رضایت‌محور، VCF/CSV و تحویل دستی به Telegram، WhatsApp، Rubika، Bale و Soroush
            - داشبورد هوش شهری با رتبه شهر، پوشش استان، سهم اپراتورها، امتیاز کیفیت و خروجی CSV
            - جعبه‌ابزار مستقل V14: TXT/CSV/VCF/JSON/Excel، حذف تکراری، Prefix، Chunk VCF، Hex/Unicode و Image Base64
            - Save As بومی در APK و مرورگرهای پشتیبانی‌شده؛ Download فقط مسیر جایگزین

            ## افزونه‌های کاربردی و ضروری همین نسخه

            - **Sequential File Renamer برای Windows:** انتخاب هم‌زمان صدها فایل، ثبت نام و رفتن مستقیم به بعدی با Enter، حفظ پسوند، Undo، کنترل تداخل، Drag & Drop، مرتب‌سازی طبیعی و گزارش CSV
            - **Messenger Contacts برای Android:** تفکیک مخاطبین بر اساس اکشن واقعی Telegram، WhatsApp، Rubika، Eitaa، Bale، Soroush و پیام‌رسان‌های دیگر، بازکردن کارت بومی مخاطب و خروجی TXT/CSV/XLSX/VCF
            - افزونهٔ Android مجوز اینترنت و `QUERY_ALL_PACKAGES` ندارد و فقط داده‌های ثبت‌شده در `ContactsContract` را می‌خواند؛ عضویت افراد در سرور پیام‌رسان‌ها حدس زده نمی‌شود.

            محدودیت رسمی: `Telegram.WebApp` فهرست کامل مخاطبین حساب را مستقیم ارائه نمی‌کند؛ نسخه ۳.۶ به‌جای API خصوصی، فایل Export انتخاب‌شده توسط خود کاربر را محلی پردازش می‌کند. دسترسی دفترچه دستگاه فقط با انتخاب یا مجوز صریح پلتفرم است.
