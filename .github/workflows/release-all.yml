name: Release All Devices
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-all.yml'
      - 'release-trigger.txt'
permissions:
  contents: write
  issues: write
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Sync web assets
        run: |
          rm -rf desktop/webapp
          mkdir -p desktop/webapp/icons
          cp index.html app.js pro.js config.js styles.css manifest.webmanifest sw.js desktop/webapp/
          cp -r icons/* desktop/webapp/icons/
      - name: Build desktop binaries
        run: |
          mkdir -p dist
          cd desktop
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o ../dist/ContactFlow_Professional_1.2_Windows_Portable.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/ContactFlow_Professional_1.2_Linux_x64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/ContactFlow_Professional_1.2_macOS_Intel .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../dist/ContactFlow_Professional_1.2_macOS_AppleSilicon .
          mkdir -p installer/payload
          cp ../dist/ContactFlow_Professional_1.2_Windows_Portable.exe installer/payload/ContactFlow.exe
          cd installer
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o ../../dist/ContactFlow_Professional_1.2_Windows_Setup.exe .
      - name: Package PWA Server Source
        run: |
          zip -qr dist/ContactFlow_Professional_1.2_PWA.zip index.html app.js pro.js config.js styles.css manifest.webmanifest sw.js icons README_FA.md PWA_TUTORIAL_FA.md PWA_TUTORIAL_PRO_FA.md
          zip -qr dist/ContactFlow_Professional_1.2_Server.zip server deploy Dockerfile docker-compose.yml DEPLOY_1_1_FA.md DEPLOY_PRO_FA.md
          git archive --format=zip --output=dist/ContactFlow_Professional_1.2_Source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop
          path: dist/*
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Sync PWA assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/icons
          cp index.html app.js pro.js config.js styles.css manifest.webmanifest sw.js android/app/src/main/assets/
          cp -r icons/* android/app/src/main/assets/icons/
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/app.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/pro.js'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/config.js'
          cp android/app/build/outputs/apk/debug/app-debug.apk ContactFlow_Professional_1.2_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ContactFlow_Professional_1.2_Android.apk
          retention-days: 30

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum * > ContactFlow_Professional_1.2_SHA256.txt
          ls -lh
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.2.0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ContactFlow Professional 1.2.0" --notes "Windows, Linux, macOS, Android, PWA, Server and full source packages. Account/Sync requires a deployed ContactFlow Server endpoint."
          fi

  report:
    if: always()
    needs: [desktop, android, release]
    runs-on: ubuntu-latest
    steps:
      - name: Report release workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          STATUS="❌"
          if [ "$DESKTOP_RESULT" = "success" ] && [ "$ANDROID_RESULT" = "success" ] && [ "$RELEASE_RESULT" = "success" ]; then STATUS="✅"; fi
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "$STATUS ContactFlow v1.2.0 Release All — desktop=$DESKTOP_RESULT android=$ANDROID_RESULT release=$RELEASE_RESULT — Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} — commit ${GITHUB_SHA}" || true
