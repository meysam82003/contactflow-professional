name: Release All Devices — Personal Ultimate 3.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'app.js'
      - 'ultimate.js'
      - 'config.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'desktop/**'
      - 'android/**'
      - 'VERSION'
      - 'README_FA.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/release-all.yml'
      - 'release-trigger.txt'

permissions:
  contents: write

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Personal Ultimate web core
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '3.0.0-alpha.1'
          node --check app.js
          node --check ultimate.js
          grep -q 'ContactFlow Personal Ultimate 3.0' index.html
          grep -q 'data-page="generator"' index.html
          grep -q 'data-page="import"' index.html
          grep -q 'data-page="contacts"' index.html
          grep -q 'data-page="exports"' index.html
          grep -q 'data-page="audience"' index.html
          grep -q 'data-page="telegram"' index.html
          grep -q 'data-page="campaign"' index.html
          grep -q 'data-page="requests"' index.html
          grep -q 'data-page="backup"' index.html
          grep -q 'data-page="activity"' index.html
          ! grep -ERn 'auth-gate|auth-login|auth-register|Forgot Password|Server URL|127\.0\.0\.1:17654|pseudoQR' \
            index.html app.js ultimate.js config.js sw.js

  desktop:
    needs: verify-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Sync web assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/webapp
          mkdir -p desktop/webapp
          cp index.html app.js ultimate.js config.js styles.css manifest.webmanifest sw.js desktop/webapp/
          cp -R icons desktop/webapp/icons

      - name: Build desktop binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          cd desktop
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o ../dist/ContactFlow_Personal_Ultimate_3.0_Windows_Portable.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/ContactFlow_Personal_Ultimate_3.0_Linux_x64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/ContactFlow_Personal_Ultimate_3.0_macOS_Intel .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../dist/ContactFlow_Personal_Ultimate_3.0_macOS_AppleSilicon .

          rm -rf installer/payload
          mkdir -p installer/payload
          cp ../dist/ContactFlow_Personal_Ultimate_3.0_Windows_Portable.exe installer/payload/ContactFlow.exe
          cd installer
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o ../../dist/ContactFlow_Personal_Ultimate_3.0_Windows_Setup.exe .

      - name: Package PWA and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pwa
          cp index.html app.js ultimate.js config.js styles.css manifest.webmanifest sw.js dist/pwa/
          cp -R icons dist/pwa/icons
          cp README_FA.md CHANGELOG.md dist/pwa/
          cp -R docs dist/pwa/docs
          (cd dist/pwa && zip -qr ../ContactFlow_Personal_Ultimate_3.0_PWA.zip .)
          rm -rf dist/pwa
          git archive --format=zip --output=dist/ContactFlow_Personal_Ultimate_3.0_Source.zip HEAD

      - name: Verify desktop files
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/ContactFlow_Personal_Ultimate_3.0_Windows_Portable.exe
          test -s dist/ContactFlow_Personal_Ultimate_3.0_Windows_Setup.exe
          test -s dist/ContactFlow_Personal_Ultimate_3.0_Linux_x64
          test -s dist/ContactFlow_Personal_Ultimate_3.0_macOS_Intel
          test -s dist/ContactFlow_Personal_Ultimate_3.0_macOS_AppleSilicon
          test -s dist/ContactFlow_Personal_Ultimate_3.0_PWA.zip
          test -s dist/ContactFlow_Personal_Ultimate_3.0_Source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Personal-Ultimate-3.0-Desktop-PWA-Source
          path: dist/*
          retention-days: 30

  android:
    needs: verify-web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Sync Personal Ultimate assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp index.html app.js ultimate.js config.js styles.css manifest.webmanifest sw.js android/app/src/main/assets/
          cp -R icons android/app/src/main/assets/icons

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "sdkVersion:'21'" apk-badging.txt
          grep "targetSdkVersion:'36'" apk-badging.txt
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          grep -q 'ContactFlow Personal Ultimate 3.0' /tmp/apk-index.html
          ! grep -E 'auth-gate|auth-login|auth-register|Server URL|127\.0\.0\.1:17654' /tmp/apk-index.html
          mkdir -p dist
          cp "$APK" dist/ContactFlow_Personal_Ultimate_3.0_Android_Alpha.apk
          sha256sum dist/ContactFlow_Personal_Ultimate_3.0_Android_Alpha.apk > dist/Android_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Personal-Ultimate-3.0-Android
          path: dist/*
          retention-days: 30

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ContactFlow-Personal-Ultimate-3.0-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          rm -f Android_SHA256.txt
          sha256sum * > ContactFlow_Personal_Ultimate_3.0_SHA256.txt
          ls -lh

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-alpha.1
          name: ContactFlow Personal Ultimate 3.0 Alpha 1
          prerelease: true
          make_latest: false
          files: release/*
          body: |
            ContactFlow Personal Ultimate 3.0 Alpha 1

            - Local-First / Accountless
            - Login/Register/Forgot Password/Server URL removed
            - Windows fixed to avoid the legacy fixed localhost origin
            - Android uses bundled local assets and no server URL prompt
            - Number generator, multi-file import, contacts, bulk editing, export queue, audience/consent, campaign composer, ad requests, backup/restore and activity log included
            - Telegram UI is QR-first. This Alpha does not generate a fake QR: real QR sign-in requires the official Telegram App credentials and a configured TDLib Native Connector in the build.
            - APK is an Alpha/debug-signed build.
