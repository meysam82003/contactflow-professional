name: Release All Devices — Personal Ultimate 3.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.source-bundles/v3/**'
      - '.source-bundles/v31/**'
      - 'enhancements/**'
      - 'telegram-miniapp/**'
      - 'scripts/apply-v31.mjs'
      - 'desktop/**'
      - 'android/**'
      - 'VERSION'
      - 'README.md'
      - 'README_FA.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/release-all.yml'
      - 'release-trigger.txt'

permissions:
  contents: write
  issues: write

jobs:
  webcore:
    runs-on: ubuntu-latest
    outputs:
      telegram_configured: ${{ steps.cfg.outputs.telegram_configured }}
      google_configured: ${{ steps.cfg.outputs.google_configured }}
      miniapp_configured: ${{ steps.cfg.outputs.miniapp_configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source version and materialize 3.0 canonical core
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '3.1.0-alpha.1'
          rm -rf /tmp/cf31 /tmp/cf31aug /tmp/cf3.tgz /tmp/cf31aug.tgz
          mkdir -p /tmp/cf31 /tmp/cf31aug
          cat .source-bundles/v3/web3.part* | base64 -d > /tmp/cf3.tgz
          tar -xzf /tmp/cf3.tgz -C /tmp/cf31
          cat .source-bundles/v31/augment.part* | base64 -d > /tmp/cf31aug.tgz
          echo 'acb866bdc9fb1610729f441dd572ec5da3e9a4901addcd9d5666cc80a9ef214e  /tmp/cf31aug.tgz' | sha256sum -c -
          tar -xzf /tmp/cf31aug.tgz -C /tmp/cf31aug

      - name: Build optional legacy Web-MTProto bundle
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/enhancements/package.json" "$GITHUB_WORKSPACE/enhancements/webpack.config.cjs" "$GITHUB_WORKSPACE/enhancements/telegram-web-entry.js" /tmp/cf31aug/enhancements/
          sed -i "s#from 'telegram/sessions';#from 'telegram/sessions/StringSession';#" /tmp/cf31aug/enhancements/telegram-web-entry.js
          cd /tmp/cf31aug/enhancements
          npm install --no-audit --no-fund
          npm run build
          test -s dist/telegram-web.bundle.js

      - name: Apply Business Bot, hosted Mini App and backup hotfix
        id: cfg
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MINIAPP_URL: ${{ secrets.MINIAPP_URL }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
        run: |
          set -euo pipefail
          cp /tmp/cf31aug/enhancements/dist/telegram-web.bundle.js /tmp/cf31/
          cp /tmp/cf31aug/enhancements/runtime-patch.js /tmp/cf31/
          cp "$GITHUB_WORKSPACE/enhancements/drive-sync.js" "$GITHUB_WORKSPACE/enhancements/business-connect.js" "$GITHUB_WORKSPACE/enhancements/enhancements.css" /tmp/cf31/
          node "$GITHUB_WORKSPACE/scripts/apply-v31.mjs" /tmp/cf31 | tee /tmp/cf31-config.json
          node - <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/cf31-config.json','utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`telegram_configured=${j.telegramConfigured}\ngoogle_configured=${j.googleConfigured}\nminiapp_configured=${j.miniAppConfigured}\n`);
          NODE

      - name: Validate 3.1 web core
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/cf31/app.js
          node --check /tmp/cf31/ultimate.js
          node --check /tmp/cf31/runtime-patch.js
          node --check /tmp/cf31/drive-sync.js
          node --check /tmp/cf31/business-connect.js
          node --check scripts/apply-v31.mjs
          grep -q 'Personal Ultimate 3.1' /tmp/cf31/index.html
          for page in generator import contacts exports audience telegram campaign requests backup activity; do
            grep -q "data-page=\"$page\"" /tmp/cf31/index.html
          done
          grep -q 'business-connect.js' /tmp/cf31/index.html
          grep -q 'drive-sync.js' /tmp/cf31/index.html
          grep -q 'runtime-patch.js' /tmp/cf31/index.html
          grep -q '"telegramMode":"business_bot"' /tmp/cf31/config.js
          grep -q '"googleMode":"oauth_or_system_folder"' /tmp/cf31/config.js
          ! grep -ER 'QR Connector not configured in this build|GOOGLE_CLIENT_ID در Build تنظیم نشده است|Google OAuth Client ID داخلی Build تنظیم نشده' /tmp/cf31/index.html /tmp/cf31/ultimate.js /tmp/cf31/drive-sync.js /tmp/cf31/business-connect.js
          ! grep -E 'native/telegram/qr' /tmp/cf31/ultimate.js
          ! grep -E 'contactflow-professional-v1\.2|pro\.js' /tmp/cf31/sw.js

      - name: Package augmented web core and PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p build/webcore build/pwa
          cp -R /tmp/cf31/. build/webcore/
          cp -R /tmp/cf31/. build/pwa/
          cp README.md README_FA.md CHANGELOG.md build/pwa/
          cp -R docs build/pwa/docs
          (cd build/pwa && zip -qr ../ContactFlow_Personal_Ultimate_3.1.0-alpha.1_PWA.zip .)
          test -s build/ContactFlow_Personal_Ultimate_3.1.0-alpha.1_PWA.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cf31-webcore
          path: build/webcore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: cf31-release-pwa
          path: build/ContactFlow_Personal_Ultimate_3.1.0-alpha.1_PWA.zip
          retention-days: 30

  desktop:
    needs: webcore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/download-artifact@v4
        with:
          name: cf31-webcore
          path: webcore

      - name: Sync exact 3.1 assets into desktop shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cf31aug && mkdir -p /tmp/cf31aug
          cat .source-bundles/v31/augment.part* | base64 -d > /tmp/cf31aug.tgz
          tar -xzf /tmp/cf31aug.tgz -C /tmp/cf31aug
          cp /tmp/cf31aug/desktop-main.go desktop/main.go
          cp /tmp/cf31aug/desktop-installer.go desktop/installer/main.go
          rm -rf desktop/webapp
          mkdir -p desktop/webapp
          cp -R webcore/. desktop/webapp/
          ! grep -ERn 'auth-gate|auth-login|auth-register|Server URL|127\.0\.0\.1:17654' desktop/webapp/index.html
          grep -q 'business-connect.js' desktop/webapp/index.html

      - name: Build Windows Linux macOS
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"; PREFIX="ContactFlow_Personal_Ultimate_${VERSION}"
          rm -rf dist && mkdir -p dist
          cd desktop
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "../dist/${PREFIX}_Windows_Portable.exe" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "../dist/${PREFIX}_Linux_x64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "../dist/${PREFIX}_macOS_Intel" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o "../dist/${PREFIX}_macOS_AppleSilicon" .
          rm -rf installer/payload && mkdir -p installer/payload
          cp "../dist/${PREFIX}_Windows_Portable.exe" installer/payload/ContactFlow.exe
          cd installer
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "../../dist/${PREFIX}_Windows_Setup.exe" .
          cd ../..
          for f in "${PREFIX}_Windows_Portable.exe" "${PREFIX}_Windows_Setup.exe" "${PREFIX}_Linux_x64" "${PREFIX}_macOS_Intel" "${PREFIX}_macOS_AppleSilicon"; do test -s "dist/$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: cf31-release-desktop
          path: dist/*
          retention-days: 30

  android:
    needs: webcore
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: actions/download-artifact@v4
        with:
          name: cf31-webcore
          path: webcore

      - name: Sync exact 3.1 assets into Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cf31aug && mkdir -p /tmp/cf31aug
          cat .source-bundles/v31/augment.part* | base64 -d > /tmp/cf31aug.tgz
          tar -xzf /tmp/cf31aug.tgz -C /tmp/cf31aug
          cp /tmp/cf31aug/MainActivity.java android/app/src/main/java/com/contactflow/pro/MainActivity.java
          cp /tmp/cf31aug/android-build.gradle android/app/build.gradle
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -R webcore/. android/app/src/main/assets/

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "sdkVersion:'21'" apk-badging.txt
          grep "targetSdkVersion:'36'" apk-badging.txt
          unzip -p "$APK" assets/index.html > /tmp/apk-index.html
          grep -q 'Personal Ultimate 3.1' /tmp/apk-index.html
          grep -q 'business-connect.js' /tmp/apk-index.html
          ! grep -E 'auth-gate|auth-login|auth-register|Server URL|127\.0\.0\.1:17654|QR Connector not configured' /tmp/apk-index.html
          mkdir -p dist
          cp "$APK" dist/ContactFlow_Personal_Ultimate_3.1.0-alpha.1_Android_Alpha.apk
          sha256sum dist/*.apk > dist/APK_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cf31-release-android
          path: dist/*
          retention-days: 30

  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hosted Mini App and Business Bot Gateway
        shell: bash
        run: |
          set -euo pipefail
          for f in telegram-miniapp/lib.php telegram-miniapp/setup.php telegram-miniapp/webhook.php telegram-miniapp/gateway.php telegram-miniapp/cron.php telegram-miniapp/health.php; do php -l "$f"; done
          test -s telegram-miniapp/miniapp.html
          grep -q 'X-Telegram-Init-Data' telegram-miniapp/miniapp.html
          grep -q 'business_connection' telegram-miniapp/webhook.php
          grep -q 'business_connection_id' telegram-miniapp/gateway.php
          grep -q 'miniapp.html' telegram-miniapp/setup.php
      - name: Package cPanel Mini App
        shell: bash
        run: |
          mkdir -p dist
          zip -qr dist/ContactFlow_Personal_Ultimate_3.1.0-alpha.1_Telegram_MiniApp_cPanel.zip telegram-miniapp docs/BUSINESS_CONNECTOR_FA.md
          test -s dist/ContactFlow_Personal_Ultimate_3.1.0-alpha.1_Telegram_MiniApp_cPanel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cf31-release-miniapp
          path: dist/*
          retention-days: 30

  source:
    needs: webcore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cf31-webcore
          path: webapp
      - name: Package full source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          cp -R webapp dist/source/webapp
          rm -rf /tmp/cf31aug && mkdir -p /tmp/cf31aug
          cat .source-bundles/v31/augment.part* | base64 -d > /tmp/cf31aug.tgz
          tar -xzf /tmp/cf31aug.tgz -C /tmp/cf31aug
          cp -R /tmp/cf31aug dist/source/v31-augmentation
          cp -R desktop android docs .github enhancements telegram-miniapp scripts dist/source/
          cp README.md README_FA.md CHANGELOG.md VERSION SECURITY.md DEPLOY_3_1_FA.md dist/source/ 2>/dev/null || true
          (cd dist/source && zip -qr ../ContactFlow_Personal_Ultimate_3.1.0-alpha.1_Source.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: cf31-release-source
          path: dist/ContactFlow_Personal_Ultimate_3.1.0-alpha.1_Source.zip
          retention-days: 30

  release:
    needs: [webcore, desktop, android, miniapp, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cf31-release-*
          path: release
          merge-multiple: true

      - name: Release info and SHA256
        shell: bash
        env:
          TG_READY: ${{ needs.webcore.outputs.telegram_configured }}
          BACKUP_READY: ${{ needs.webcore.outputs.google_configured }}
          MINIAPP_READY: ${{ needs.webcore.outputs.miniapp_configured }}
        run: |
          set -euo pipefail
          cd release
          cat > ContactFlow_Personal_Ultimate_3.1.0-alpha.1_RELEASE_INFO_FA.txt <<EOF
          ContactFlow Personal Ultimate 3.1.0-alpha.1 — Business/MiniApp/Backup Hotfix
          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Telegram Business Bot connector ready without API ID/Hash: ${TG_READY}
          Backup fallback ready without mandatory GOOGLE_CLIENT_ID: ${BACKUP_READY}
          Hosted Mini App URL mode ready without build secret: ${MINIAPP_READY}

          Telegram primary mode: Bot Pair + Telegram Business Connection.
          Legacy Web-MTProto files are retained but are no longer required or the default connector.
          Mini App deployment: unzip on HTTPS hosting and register https://domain/path/miniapp.html at runtime.
          Backup: Android System Picker, desktop Sync Folder/file fallback, optional Google OAuth if Client ID exists.
          EOF
          find . -maxdepth 1 -type f ! -name 'ContactFlow_Personal_Ultimate_3.1.0-alpha.1_SHA256.txt' -print0 | sort -z | xargs -0 sha256sum > ContactFlow_Personal_Ultimate_3.1.0-alpha.1_SHA256.txt
          ls -lh

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v3.1.0-alpha.1
          target_commitish: main
          name: ContactFlow Personal Ultimate 3.1.0-alpha.1
          prerelease: true
          make_latest: false
          overwrite_files: true
          preserve_order: true
          files: release/*
          body: |
            # ContactFlow Personal Ultimate 3.1.0-alpha.1 — Hotfix

            - Primary Telegram connector is Bot Pair + Telegram Business Connection; no TELEGRAM_API_ID / TELEGRAM_API_HASH required for this path.
            - Up to 10 local account pairings with manual sender selection, connection labels, known-chat list and test-send.
            - Promotional campaigns are limited to explicit opt-in Business chats; queue progress, cancel and Telegram retry_after handling are included.
            - Hosted Mini App restored: unzip to HTTPS hosting and register `https://domain/path/miniapp.html` at runtime; no Mini App build secret required.
            - Backup no longer fails when GOOGLE_CLIENT_ID is absent: Android System Picker, desktop Sync Folder and file backup/restore are available; Google OAuth remains optional.
            - One-click VCF workflow prepares large contact lists for import into system Contacts; no fake Bot-side contact import.
            - Existing ContactFlow 3.0/3.1 features remain in the build.

            Persian setup and troubleshooting docs are included in the repository and Source ZIP.

  report:
    if: always()
    needs: [webcore, desktop, android, miniapp, source, release]
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        env:
          GH_TOKEN: ${{ github.token }}
          WEB: ${{ needs.webcore.result }}
          DESKTOP: ${{ needs.desktop.result }}
          ANDROID: ${{ needs.android.result }}
          MINIAPP: ${{ needs.miniapp.result }}
          SOURCE: ${{ needs.source.result }}
          RELEASE: ${{ needs.release.result }}
        shell: bash
        run: |
          if [[ "$WEB" == success && "$DESKTOP" == success && "$ANDROID" == success && "$MINIAPP" == success && "$SOURCE" == success && "$RELEASE" == success ]]; then
            gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "✅ ContactFlow 3.1 hotfix release succeeded — web=$WEB desktop=$DESKTOP android=$ANDROID miniapp=$MINIAPP source=$SOURCE release=$RELEASE — Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
          else
            gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "❌ ContactFlow 3.1 hotfix release needs attention — web=$WEB desktop=$DESKTOP android=$ANDROID miniapp=$MINIAPP source=$SOURCE release=$RELEASE — Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
            exit 1
          fi
