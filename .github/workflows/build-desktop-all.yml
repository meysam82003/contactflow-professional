name: Build Desktop All
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'app.js'
      - 'pro.js'
      - 'config.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - '.github/workflows/build-desktop-all.yml'
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Sync web assets
        run: |
          rm -rf desktop/webapp
          mkdir -p desktop/webapp/icons
          cp index.html app.js pro.js config.js styles.css manifest.webmanifest sw.js desktop/webapp/
          cp -r icons/* desktop/webapp/icons/
      - name: Build Windows Linux macOS
        working-directory: desktop
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o ../dist/ContactFlow_Windows_x64.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/ContactFlow_Linux_x64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/ContactFlow_macOS_Intel .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../dist/ContactFlow_macOS_AppleSilicon .
      - uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Desktop-All
          path: dist/*
          retention-days: 30
