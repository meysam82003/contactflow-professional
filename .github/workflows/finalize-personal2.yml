name: Finalize ContactFlow Personal 2.0 replacement

on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/finalize-personal2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote staging when necessary
        run: |
          if [ -d __personal2_stage__ ]; then
            test -f __personal2_stage__/VERSION
            grep -qx '2.0.0-alpha.1' __personal2_stage__/VERSION
            node --check __personal2_stage__/web/app.js
            rm -rf /tmp/contactflow-personal2
            mkdir -p /tmp/contactflow-personal2
            cp -a __personal2_stage__/. /tmp/contactflow-personal2/
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a /tmp/contactflow-personal2/. .
          fi
      - name: Verify final Personal 2.0 tree
        run: |
          grep -qx '2.0.0-alpha.1' VERSION
          node --check web/app.js
          test -f web/index.html
          test -f android/app/src/main/java/ir/contactflow/personal/MainActivity.java
          test -f desktop/main.go
          test ! -e install.php
          test ! -e api.php
          test ! -d __personal2_stage__
          ! grep -RniE 'auth-gate|cloud-login|cloud-register|sync-push|sync-pull|/api/v1/auth|Server URL' web desktop android
      - name: Remove migration helpers and commit final tree
        run: |
          rm -f .github/workflows/promote-personal2.yml
          rm -f .github/workflows/dispatch-personal2-promote.yml
          rm -f .github/workflows/finalize-personal2.yml
          rm -f PERSONAL2_UPLOAD_REQUESTED.txt
          git config user.name 'ContactFlow Builder'
          git config user.email 'contactflow-builder@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository already finalized.'
          else
            git commit -m 'Finalize ContactFlow Personal 2.0 repository replacement'
            git push origin HEAD:main
          fi
