name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'app.js'
      - 'pro.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'config.js'
      - 'icons/**'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Sync web assets
        run: |
          rm -rf desktop/webapp
          mkdir -p desktop/webapp/icons
          cp index.html app.js pro.js config.js styles.css manifest.webmanifest sw.js desktop/webapp/
          cp -r icons/* desktop/webapp/icons/
      - name: Build portable
        working-directory: desktop
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags='-s -w -H=windowsgui' -o ../ContactFlow_Professional_Portable.exe .
      - name: Build installer
        run: |
          mkdir -p desktop/installer/payload
          cp ContactFlow_Professional_Portable.exe desktop/installer/payload/ContactFlow.exe
          cd desktop/installer
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o ../../ContactFlow_Professional_Setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: ContactFlow-Professional-Windows
          path: |
            ContactFlow_Professional_Portable.exe
            ContactFlow_Professional_Setup.exe
          retention-days: 30
