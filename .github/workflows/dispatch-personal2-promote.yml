name: Dispatch Personal2 Promote
on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/dispatch-personal2-promote.yml']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote if staging exists
        run: |
          if [ ! -d __personal2_stage__ ]; then
            echo 'Personal 2.0 already promoted; nothing to do.'
            exit 0
          fi
          test -f __personal2_stage__/VERSION
          grep -qx '2.0.0-alpha.1' __personal2_stage__/VERSION
          node --check __personal2_stage__/web/app.js
          rm -rf /tmp/contactflow-personal2
          mkdir -p /tmp/contactflow-personal2
          cp -a __personal2_stage__/. /tmp/contactflow-personal2/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/contactflow-personal2/. .
          git config user.name 'ContactFlow Builder'
          git config user.email 'contactflow-builder@users.noreply.github.com'
          git add -A
          git commit -m 'Replace repository with ContactFlow Personal 2.0 local-first'
          git push origin HEAD:main
