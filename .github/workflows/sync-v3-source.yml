name: Sync Personal Ultimate 3.0 Canonical Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sync-v3-trigger.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild canonical web bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/contactflow-v3
          cat .source-bundles/v3/web3.part* | base64 -d > /tmp/contactflow-v3.tgz
          tar -xzf /tmp/contactflow-v3.tgz -C /tmp/contactflow-v3

          node --check /tmp/contactflow-v3/app.js
          node --check /tmp/contactflow-v3/ultimate.js
          grep -q 'ContactFlow Personal Ultimate 3.0' /tmp/contactflow-v3/index.html

          if grep -ERn 'auth-gate|auth-login|auth-register|Forgot Password|Server URL|127\.0\.0\.1:17654|pseudoQR' \
            /tmp/contactflow-v3/index.html \
            /tmp/contactflow-v3/app.js \
            /tmp/contactflow-v3/ultimate.js \
            /tmp/contactflow-v3/config.js \
            /tmp/contactflow-v3/sw.js; then
            echo 'Legacy account/server/fake-QR code detected.' >&2
            exit 1
          fi

      - name: Sync root web core and embedded assets
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/contactflow-v3/index.html index.html
          cp /tmp/contactflow-v3/app.js app.js
          cp /tmp/contactflow-v3/ultimate.js ultimate.js
          cp /tmp/contactflow-v3/config.js config.js
          cp /tmp/contactflow-v3/styles.css styles.css
          cp /tmp/contactflow-v3/manifest.webmanifest manifest.webmanifest
          cp /tmp/contactflow-v3/sw.js sw.js
          rm -rf icons
          cp -R /tmp/contactflow-v3/icons icons

          rm -f pro.js localplus.js localplus.css

          rm -rf desktop/webapp
          mkdir -p desktop/webapp
          cp index.html app.js ultimate.js config.js styles.css manifest.webmanifest sw.js desktop/webapp/
          cp -R icons desktop/webapp/icons

          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp index.html app.js ultimate.js config.js styles.css manifest.webmanifest sw.js android/app/src/main/assets/
          cp -R icons android/app/src/main/assets/icons

      - name: Verify synchronized source
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check ultimate.js
          grep -q 'data-page="generator"' index.html
          grep -q 'data-page="import"' index.html
          grep -q 'data-page="contacts"' index.html
          grep -q 'data-page="exports"' index.html
          grep -q 'data-page="audience"' index.html
          grep -q 'data-page="telegram"' index.html
          grep -q 'data-page="campaign"' index.html
          grep -q 'data-page="requests"' index.html
          grep -q 'data-page="backup"' index.html
          grep -q 'data-page="activity"' index.html
          ! grep -ERn 'auth-gate|auth-login|auth-register|Forgot Password|Server URL|127\.0\.0\.1:17654|pseudoQR' \
            index.html app.js ultimate.js config.js sw.js desktop/webapp android/app/src/main/assets

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'contactflow-build[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html app.js ultimate.js config.js styles.css manifest.webmanifest sw.js icons desktop/webapp android/app/src/main/assets pro.js localplus.js localplus.css || true
          if git diff --cached --quiet; then
            echo 'Canonical source is already synchronized.'
            exit 0
          fi
          git commit -m 'source: sync Personal Ultimate 3.0 canonical web core'
          git push origin HEAD:main
